name: Sprint 1 quality gates
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q balance_app.py features.py survey_schema.py train.py ml pages tests
      - name: Unit and ML smoke tests
        run: python -m pytest -q
      - name: Deployment entrypoint check
        run: |
          test -s balance_app.py
          test -s requirements.txt
          test -s .streamlit/config.toml
          python -c "import streamlit, shap, xgboost; print('Runtime imports OK')"
